<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#091521"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bird Sniper">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg">
<title>Bird Sniper — Endless Run</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><span class="logo">🐦</span><div><strong>BIRD SNIPER</strong><small>ENDLESS RUN</small></div></div><div class="top-actions"><button id="soundBtn" class="iconbtn" aria-label="Toggle sound">🔊</button><button id="pauseBtn" class="iconbtn" aria-label="Pause">Ⅱ</button></div></header>
  <section class="game-shell"><canvas id="game" aria-label="Bird Sniper game canvas"></canvas>
    <div id="overlay" class="overlay"><div class="panel"><div class="eyebrow">INFINITE SURVIVAL</div><h1 id="overlayTitle">BIRD SNIPER</h1><p id="overlayText">Dodge bullets. Jump over danger. Every hit changes your bird.</p><div class="bird-preview">🐦 🦜 🦉 🦩 🐧</div><button id="startBtn" class="primary">PLAY NOW <span>▶</span></button><div class="tip">Tap left to JUMP · Hold right to DUCK</div></div></div>
    <div id="hitBanner" class="hit-banner">BIRD SWITCH!</div>
  </section>
  <section class="hud"><div class="stat"><span>SCORE</span><b id="score">000000</b></div><div class="stat"><span>BEST</span><b id="best">000000</b></div><div class="stat"><span>YOUR BIRD</span><b id="birdName">Robin</b></div><div class="stat"><span>HITS</span><b id="hits">0</b></div></section>
  <section class="touch-controls"><button id="jumpBtn" class="control jump"><span>⬆</span><b>JUMP</b><small>tap / hold</small></button><button id="duckBtn" class="control duck"><span>⬇</span><b>DUCK</b><small>hold</small></button></section>
  <footer><span>NO FINISH LINE</span><span>MADE FOR MOBILE + DESKTOP</span></footer>
</main><script src="game.js"></script>
</body></html>
